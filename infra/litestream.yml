# Continuous replication of the canonical SQLite file to R2 (seconds of loss
# instead of an hour). Credentials come from /etc/litestream.env
# (LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY).
dbs:
  - path: /srv/sim-data/sim.db
    replica:
      url: s3://${R2_BUCKET}/sim/litestream/sim.db?endpoint=${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com&region=auto
      sync-interval: 10s
      retention: 168h
      snapshot-interval: 6h
