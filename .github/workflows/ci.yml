# Application checks on isolated runners, scoped to what a change touches.
# The job matrix is the release gate's CPU contract split for GitHub runners; `scope` picks jobs with the same path
# map as `tools/test-harness/release-gate.mjs --scope auto` (.github/scripts/ci-scope.mjs). Branch protection requires
# the single `ci-ok` check. The full Modal gate still qualifies releases (release.yml); CI is the per-PR check.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Where tools/assets pull keeps its content-addressed download cache (restored by actions/cache below).
  SIM_ASSETS_CACHE: ${{ github.workspace }}/../.sim-assets-cache
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      any: ${{ steps.scope.outputs.any }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - id: scope
        name: Pick jobs from changed paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run checks everything.
          if [ "$EVENT" = workflow_dispatch ]; then BASE=; fi
          node .github/scripts/ci-scope.mjs --base "$BASE" --head "$HEAD_SHA"

  # Fast, dependency-free checks of the repo's own tooling; always runs.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Media manifest, CI scope, proof, merge train, hooks, changelog and guard tests
        run: >-
          node --test --test-concurrency=1
          tools/assets/manifest.test.mjs
          .github/scripts/ci-scope.test.mjs
          .github/scripts/guards.test.mjs
          .github/scripts/merge-train.test.mjs
          .github/scripts/install-hooks.test.mjs
          tools/proof/tier.test.mjs
          tools/proof/acceptance.test.mjs
          tools/proof/upload.test.mjs
          tools/changelog/compile.test.mjs

  qualify:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # pnpm's version comes from package.json `packageManager` (pnpm@10.27.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore media cache
        if: matrix.assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SIM_ASSETS_CACHE }}
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
          restore-keys: sim-assets-
      # Bounded: an object missing from the CDN (not yet published) fails the job with the list of paths, never hangs.
      - name: Pull media
        if: matrix.assets
        timeout-minutes: 15
        run: |
          if ! timeout 840 pnpm assets:pull --quiet; then
            echo "::error::Media pull failed or timed out. The paths above are missing from the CDN or failed verification against tools/assets/manifest.json; publish them first (tools/cdn/publish.mjs, see tools/assets/README.md), then re-run."
            exit 1
          fi
      - name: Run assigned checks
        env:
          CHECK_KIND: ${{ matrix.kind }}
          SERVER_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          case "$CHECK_KIND" in
            types-web)
              pnpm typecheck
              pnpm --filter @sim/web build
              ;;
            packages)
              pnpm -r --filter '!mars-campus-viewer' --filter '!@sim/server' test
              ;;
            native)
              pnpm test:mars
              ;;
            web)
              # V4-web: every apps/web unit test, TSX included
              bash tools/test-harness/web-suite.sh
              ;;
            launcher)
              # V3-launcher-unit; launcher.test.mjs takes its ports from LAUNCHER_TEST_PORT_BASE (default 6200)
              node --test --test-concurrency=1 tools/world-launcher/*.test.mjs
              ;;
            client-cli)
              # V3-client-cli
              pnpm test:client
              ;;
            latency)
              pnpm --filter @sim/server exec node --test --test-concurrency=1 src/owner-response-milestones.test.ts
              ;;
            server)
              node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const all = readdirSync('apps/server/src').filter(f => f.endsWith('.test.ts')).sort();
          const latency = 'owner-response-milestones.test.ts';
          if (!all.includes(latency)) throw Error('Expected latency test is missing');
          const pool = all.filter(f => f !== latency), shard = Number(process.env.SERVER_SHARD);
          if (![0, 1].includes(shard)) throw Error('Invalid server shard');
          const files = pool.filter((_, i) => i % 2 === shard).map(f => `src/${f}`);
          if (!files.length) throw Error('Empty server shard');
          console.log(JSON.stringify({ shard, totalServerFiles: all.length, files }));
          const result = spawnSync('pnpm', ['--filter', '@sim/server', 'exec', process.execPath, '--test', '--test-concurrency=1', ...files], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
              ;;
            *) echo "unknown check kind: $CHECK_KIND"; exit 1 ;;
          esac

  # The one required check: passes when every selected job passed (or none was needed).
  ci-ok:
    runs-on: ubuntu-latest
    needs: [scope, repo, qualify]
    if: always()
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          REPO: ${{ needs.repo.result }}
          QUALIFY: ${{ needs.qualify.result }}
          ANY: ${{ needs.scope.outputs.any }}
        run: |
          echo "scope=$SCOPE repo=$REPO qualify=$QUALIFY jobs_selected=$ANY"
          test "$SCOPE" = success
          test "$REPO" = success
          if [ "$ANY" = true ]; then test "$QUALIFY" = success; else test "$QUALIFY" = skipped; fi
