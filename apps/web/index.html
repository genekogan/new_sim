<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101110" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sim" />
    <title>Sim</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- QA F12: a world page shows the arrival card from its first paint (main.css is in), not a blank page until its
         JavaScript runs (old /w/eden on a 4G phone: ~4 s). It sits beside #root and goes once the app's own card or the
         early poster is up (no blank flash between them), or once the app has drawn something else for 0.6 s. -->
    <script>(function(){try{if(!/\/w\/[a-z][a-z0-9-]{0,31}(\/|$)/.test(location.pathname)||/[?&]shot=/.test(location.search))return;var d=document,r=d.getElementById('root'),b=d.createElement('div');b.id='boot-arrival';b.className='viewer-arrival';b.style.position='fixed';b.setAttribute('role','status');b.setAttribute('aria-live','polite');b.innerHTML='<div class="viewer-arrival-card"><span class="viewer-arrival-spinner" aria-hidden="true"></span><div><p class="viewer-arrival-title">Arriving</p><p class="viewer-arrival-stage">Loading the world\u2026</p></div></div>';d.body.appendChild(b);var t0=0,iv=setInterval(function(){var now=Date.now();if(d.querySelector('#root .viewer-arrival,.early-world-poster')||(r&&r.firstElementChild&&(t0=t0||now)&&now-t0>600)){clearInterval(iv);b.remove();}},50);}catch(e){}})()</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
