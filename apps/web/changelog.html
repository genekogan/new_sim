<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="What changed in Sim, release by release." />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101110" media="(prefers-color-scheme: dark)" />
    <title>Changelog · Sim</title>
    <!-- The public changelog (issue #388), filled from CHANGELOG.md at build time (src/changelog-page.ts). No script,
         no request beyond this document. Tokens and type follow the world list (src/styles.css :root, .world-list). -->
    <style>
      :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1b1b18; --dim: #77776f; --line: #d8d8cf; --accent: #0b6e4f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101110; --fg: #e4e4dc; --dim: #8b8b82; --line: #2b2c29; --accent: #6fd6a8; } }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      a { color: var(--accent); }
      main { max-width: 1100px; margin: 8vh auto; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); box-sizing: border-box; }
      .cl-nav a { color: var(--dim); text-decoration: none; }
      .cl-nav a:hover { color: var(--fg); text-decoration: underline; }
      .cl-head { margin: 28px 0 40px; }
      .cl-head h1 { margin: 0 0 10px; }
      .cl-head p { margin: 0; max-width: 620px; }
      .cl-release { display: grid; grid-template-columns: 180px minmax(0, 720px); gap: 0 32px; border-top: 1px solid var(--line); padding: 22px 0 8px; }
      .cl-release h2 { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.5; }
      .cl-v { color: inherit; text-decoration: none; font-size: 18px; }
      .cl-v:hover { text-decoration: underline; }
      .cl-release time { display: block; color: var(--dim); font-weight: 400; }
      .cl-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600; margin: 4px 0 8px; }
      .cl-body ul { margin: 0 0 18px; padding: 0 0 0 1.2em; }
      .cl-body li { font-size: 13.5px; line-height: 1.6; margin: 0 0 6px; overflow-wrap: anywhere; }
      .cl-body code { font-size: .95em; padding: 0 3px; border: 1px solid var(--line); border-radius: 3px; }
      .cl-note { margin: 2px 0 18px; color: var(--dim); font-size: 13.5px; }
      .cl-end h2 { color: var(--dim); }
      @media (max-width: 640px) {
        main { margin: 3vh auto; padding: 16px; }
        .cl-head { margin: 20px 0 28px; }
        .cl-release { grid-template-columns: minmax(0, 1fr); padding-top: 18px; }
        .cl-release h2 { margin-bottom: 12px; }
        .cl-release time { display: inline; margin-left: 8px; }
      }
    </style>
  </head>
  <body>
    <main>
<!--changelog-->
    </main>
  </body>
</html>
