packages:
  - packages/*
  - apps/*
  - mars/viewer

# Security overrides (SEC 2026-10-20, pnpm audit): transitive deps pinned to patched releases.
# Runtime: sharp via @gltf-transform/functions on the server. Dev/build only: undici (wrangler), tinypool (oxfmt),
# source-map-js (vite/postcss).
overrides:
  sharp@>=0.35.0 <0.35.5: ^0.35.5
  undici@>=7.0.0 <7.29.1: ^7.29.1
  tinypool@<2.1.2: ^2.1.2
  source-map-js@<1.2.2: ^1.2.2
