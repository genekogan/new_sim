<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Camera varied runtime suite</title>
    <style>
      body {
        margin: 0;
        background: #101820;
        color: #fff;
        font: 17px system-ui;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 20px;
        right: 20px;
        line-height: 1.6;
      }
      .policies {
        display: flex;
        justify-content: space-around;
        margin-top: 18px;
        font-size: 20px;
      }
      nav {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      nav label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        max-width: min(560px, calc(100vw - 150px));
      }
      button,
      select {
        background: #284455;
        color: white;
        padding: 6px 10px;
        border: 1px solid #7092a4;
        border-radius: 4px;
        font: inherit;
      }
      button:disabled,
      select:disabled {
        opacity: 0.5;
      }
      @media (max-width: 800px) {
        header {
          position: relative;
        }
        #status {
          position: relative;
          bottom: auto;
          left: auto;
          right: auto;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <b id="title">Loading recorded camera tour</b>
      <nav aria-label="Replay controls">
        <label
          >Scenario
          <select
            id="scenario"
            aria-label="Replay scenario"
            data-replay-control
            disabled
          >
            <option value="all">All six scenarios</option>
          </select></label
        >
        <button id="play" data-replay-control disabled>Play</button>
        <button id="pause" data-replay-control disabled>Pause</button>
        <button id="restart" data-replay-control disabled>Restart</button>
      </nav>
      <div class="policies">
        <span id="left"></span><span id="right"></span>
      </div>
    </header>
    <div id="status">
      Recorded replay of hypothetical Lab scenarios. Policies film the same
      world take. Loading demo data…
    </div>
    <script type="module" src="./suite-view.ts"></script>
  </body>
</html>
