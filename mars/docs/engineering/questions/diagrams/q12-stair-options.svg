<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" font-family="system-ui,-apple-system,Helvetica,sans-serif" font-size="15"><rect width="900" height="220" fill="#fff"/><text x="150" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">A. Two side boards (stringers)</text><rect x="30" y="160" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="132" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="104" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="76" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="36" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="252" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><text x="150" y="205" font-size="13" font-weight="400" text-anchor="middle" fill="#1a1a1a">treads span the full 4.45 m</text><text x="470" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">B. Four stringers</text><rect x="350" y="160" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="350" y="132" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="350" y="104" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="350" y="76" width="240" height="8" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><rect x="356" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="426" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="496" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="572" y="70" width="12" height="110" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><text x="470" y="205" font-size="13" font-weight="400" text-anchor="middle" fill="#1a1a1a">extra support under the middle</text><text x="770" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">C. A ramp, not a stair</text><polygon points="660,180 880,180 880,80" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="770" y="205" font-size="13" font-weight="400" text-anchor="middle" fill="#1a1a1a">(write the details in the box)</text></svg>