<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="system-ui,-apple-system,Helvetica,sans-serif" font-size="15"><rect width="880" height="240" fill="#fff"/><text x="215" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">A. Plywood straight on beams 4 ft apart</text><rect x="60" y="150" width="26" height="34" fill="#e0661b" stroke="#1a1a1a" stroke-width="1.5"/><rect x="344" y="150" width="26" height="34" fill="#e0661b" stroke="#1a1a1a" stroke-width="1.5"/><rect x="50" y="136" width="330" height="14" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><line x1="73" y1="200" x2="357" y2="200" stroke="#d62020" stroke-width="2"/><text x="215" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#d62020">4 ft with nothing underneath</text><text x="665" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">B. Joists every 2 ft under the plywood</text><rect x="510" y="150" width="26" height="34" fill="#e0661b" stroke="#1a1a1a" stroke-width="1.5"/><rect x="794" y="150" width="26" height="34" fill="#e0661b" stroke="#1a1a1a" stroke-width="1.5"/><rect x="523" y="110" width="12" height="40" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="592" y="110" width="12" height="40" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="661" y="110" width="12" height="40" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="730" y="110" width="12" height="40" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="799" y="110" width="12" height="40" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><rect x="500" y="96" width="330" height="14" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="665" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">no more than 2 ft between supports</text></svg>