<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" font-family="system-ui,-apple-system,Helvetica,sans-serif" font-size="15"><rect width="660" height="290" fill="#fff"/><text x="320" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">A. What the model does now: 6 ft + 6 ft + 3 ft, joined over beams</text><rect x="20" y="50" width="240" height="60" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">6 ft</text><rect x="260" y="50" width="240" height="60" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">6 ft</text><rect x="500" y="50" width="120" height="60" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">3 ft</text><text x="320" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">B. For example 8 ft + 7 ft, with blocking under the joint</text><rect x="20" y="172" width="320" height="60" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="180.0" y="208" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">8 ft</text><rect x="340" y="172" width="280" height="60" fill="#e2c48d" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="208" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">7 ft</text><rect x="332" y="240" width="16" height="14" fill="#b07a3c" stroke="#1a1a1a" stroke-width="1.5"/><text x="340" y="275" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">blocking</text></svg>